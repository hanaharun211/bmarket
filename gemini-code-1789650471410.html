<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BMARKET — Simple. Trusted. Convenient.">
  <title>BMARKET | Simple. Trusted. Convenient.</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f4f2;
      color: #171717;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 18px;
    }

    .page {
      width: 100%;
      max-width: 480px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e2dd;
      border-radius: 28px;
      padding: 44px 28px 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
    }

    /* LOGO */
    .brand-mark {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border: 2px solid #171717;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
      background: #fafafa;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.03);
    }

    /* BRAND */
    h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 11px;
      font-weight: 700;
      color: #888880;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    /* INTRO */
    .intro {
      color: #555550;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 auto 32px;
    }

    /* BUTTONS */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      position: relative;
      min-height: 58px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e2e2dd;
      border-radius: 18px;
      background: #ffffff;
      color: #171717;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #fafafa;
      border-color: #d0d0c8;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* ICON CONTAINER */
    .icon {
      position: absolute;
      left: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f1f1ec;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* PRIMARY BUTTON */
    .primary {
      background: #171717;
      color: #ffffff;
      border-color: #171717;
    }

    .primary:hover {
      background: #2a2a2a;
      border-color: #2a2a2a;
      box-shadow: 0 10px 25px rgba(23, 23, 23, 0.2);
    }

    .primary .icon {
      background: #ffffff;
      color: #171717;
    }

    /* FOOTER TEXT */
    .note {
      margin-top: 28px;
      font-size: 12px;
      color: #888880;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #999990;
    }

    /* MOBILE ADJUSTMENTS */
    @media (max-width: 380px) {
      .card {
        padding: 36px 20px 24px;
        border-radius: 24px;
      }

      h1 {
        font-size: 24px;
      }

      .intro {
        font-size: 13px;
      }
    }
  </style>
</head>
